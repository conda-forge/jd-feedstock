schema_version: 1

context:
  version: "2.5.0"

package:
  name: jd
  version: ${{ version }}

source:
  url: https://github.com/josephburnett/jd/archive/v${{ version }}.tar.gz
  sha256: f4d141122ad91d1e7628e9cfee95ca183113e144872cce61f6d3d56449efa19b

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - jd --help

about:
  summary: JSON diff and patch
  license: MIT
  license_file:
    - LICENSE
    - library_licenses/
  homepage: https://github.com/josephburnett/jd

extra:
  recipe-maintainers:
    - danielnachun
    - moritzwilksch
