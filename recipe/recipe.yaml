schema_version: 1

context:
  version: "2.3.1"

package:
  name: jd
  version: ${{ version }}

source:
  url: https://github.com/josephburnett/jd/archive/v${{ version }}.tar.gz
  sha256: 914d6f131d6223b2805a33f6c39ceba647a2dd06e4cc3cf0eba8c20b9199bf63

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - jd --help

about:
  summary: JSON diff and patch
  license: MIT
  license_file:
    - LICENSE
    - library_licenses/
  homepage: https://github.com/josephburnett/jd

extra:
  recipe-maintainers:
    - danielnachun
    - moritzwilksch
